name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Configure ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Configure ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Configure ANDROID_KEY_ALIAS."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Configure ANDROID_KEY_PASSWORD."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/freelife-release.jks"
      - name: Build APK and Play Store bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/freelife-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  desktop:
    name: Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libclang-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-win64-gpl-shared-7.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = (Get-ChildItem $env:RUNNER_TEMP -Directory -Filter "ffmpeg-n7*win64*").FullName
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "$dir\bin" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb,appimage
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles msi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
      - name: Name release assets
        run: |
          mkdir -p release
          find release-assets/android-release -name '*.apk' -exec cp {} release/FreeLife-Android.apk \;
          find release-assets/android-release -name '*.aab' -exec cp {} release/FreeLife-Android-Play-Store.aab \;
          find release-assets/desktop-ubuntu-24.04 -name '*.deb' -exec cp {} release/ \;
          find release-assets/desktop-ubuntu-24.04 -name '*.AppImage' -exec cp {} release/ \;
          find release-assets/desktop-windows-latest -name '*.msi' -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -type f | wc -l)" -ge 5
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
