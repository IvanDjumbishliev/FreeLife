name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/mobile/rust -> target

      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path apps/mobile/rust/Cargo.toml --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The Flutter bridge crate is pure Rust, so check it here too.
      - name: Clippy (mobile bridge)
        run: cargo clippy --manifest-path apps/mobile/rust/Cargo.toml --all-targets -- -D warnings
