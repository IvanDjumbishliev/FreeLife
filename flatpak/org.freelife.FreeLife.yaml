app-id: org.freelife.FreeLife
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: freelife-desktop
build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download
modules:
  - name: freelife
    buildsystem: simple
    build-commands:
      - corepack pnpm --dir apps/desktop install --frozen-lockfile
      - corepack pnpm --dir apps/desktop tauri build --no-bundle
      - install -Dm755 apps/desktop/src-tauri/target/release/freelife-desktop /app/bin/freelife-desktop
      - install -Dm644 flatpak/org.freelife.FreeLife.desktop /app/share/applications/org.freelife.FreeLife.desktop
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.freelife.FreeLife.png
      - install -Dm644 flatpak/org.freelife.FreeLife.metainfo.xml /app/share/metainfo/org.freelife.FreeLife.metainfo.xml
    sources:
      - type: git
        url: https://github.com/IvanDjumbishliev/FreeLife.git
        tag: v0.1.0
