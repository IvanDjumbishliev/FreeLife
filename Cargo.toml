[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/discovery",
    "packages/transfer",
    "packages/clipboard",
    "packages/camera",
    "relay",
]
# The app crates have platform-specific toolchains (webkit2gtk for Tauri,
# flutter_rust_bridge codegen for mobile), so they are built by their own
# CI jobs rather than as part of `cargo test --workspace`.
exclude = [
    "apps/desktop/src-tauri",
    "apps/mobile/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/IvanDjumbishliev/FreeLife"
rust-version = "1.88"

[workspace.dependencies]
freelife-core = { path = "packages/core" }
freelife-discovery = { path = "packages/discovery" }
freelife-transfer = { path = "packages/transfer" }
freelife-clipboard = { path = "packages/clipboard" }
freelife-camera = { path = "packages/camera" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v8", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.21"
# bincode 3.0.0 is an intentional `compile_error!` tombstone (the project is
# unmaintained); 2.0.1 is the last working release.
bincode = { version = "=2.0.1", features = ["serde"] }
hex = "0.4"
keyring = "4"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tempfile = "3"
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
clipboard-win = "5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }
# Same versions arboard uses on Linux, so they're shared rather than duplicated.
x11rb = "0.13"
wl-clipboard-rs = "0.9"
ffmpeg-next = { version = "7", default-features = false, features = ["codec", "format", "software-scaling"] }
v4l = "0.14"
base64 = "0.22"
sha2 = "0.10"
axum = "0.8"
tower = "0.5"
http-body-util = "0.1"

# Hashing 50 MB test files is painfully slow unoptimized; these crates are
# hot loops we never need to step through.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3
