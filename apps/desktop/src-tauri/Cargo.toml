[package]
name = "freelife-desktop"
version = "0.1.0"
description = "FreeLife desktop app"
edition = "2021"
license = "MIT"
rust-version = "1.89"

# Built separately from the root workspace (see the `exclude` list there)
# because Tauri needs system webview libraries.
[workspace]

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "freelife_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freelife-core = { path = "../../../packages/core" }
freelife-transfer = { path = "../../../packages/transfer" }
freelife-clipboard = { path = "../../../packages/clipboard" }
freelife-camera = { path = "../../../packages/camera" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
base64 = "0.22"
open = "5"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"
