[package]
name = "freelife-desktop"
version = "0.1.0"
description = "FreeLife desktop app"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# Built separately from the root workspace (see the `exclude` list there)
# because Tauri needs system webview libraries.
[workspace]

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "freelife_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freelife-core = { path = "../../../packages/core" }
freelife-discovery = { path = "../../../packages/discovery" }
freelife-transfer = { path = "../../../packages/transfer" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
