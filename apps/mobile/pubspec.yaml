name: freelife
description: "FreeLife mobile app — your devices, one ecosystem."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Must match the `flutter_rust_bridge` version in rust/Cargo.toml exactly.
  flutter_rust_bridge: 2.13.0
  # Builds rust/ into the app via cargokit.
  rust_lib_freelife:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
