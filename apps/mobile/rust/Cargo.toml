[package]
# Must match `libname` in ../rust_builder/android/build.gradle and the
# library stem flutter_rust_bridge loads.
name = "rust_lib_freelife"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.88"

# Built separately from the root workspace (see the `exclude` list there).
[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
# Must match the `flutter_rust_bridge` version in ../pubspec.yaml exactly.
flutter_rust_bridge = "=2.13.0"
freelife-core = { path = "../../../packages/core" }
freelife-transfer = { path = "../../../packages/transfer" }
freelife-clipboard = { path = "../../../packages/clipboard" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
