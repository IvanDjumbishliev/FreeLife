[package]
name = "freelife-camera"
description = "ContinuityCamera: stream a phone's camera to a desktop as a virtual webcam."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `decode` pulls in FFmpeg. The desktop needs it; the phone only encodes and
# builds without it (see apps/mobile/rust/Cargo.toml).
[features]
default = ["decode"]
decode = ["dep:ffmpeg-next", "dep:base64", "dep:image"]

[dependencies]
base64 = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
freelife-core.workspace = true
freelife-transfer.workspace = true
image = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
v4l.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "camera_pipeline"
required-features = ["decode"]
